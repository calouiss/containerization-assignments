version: "3.8"
services:

  books-api:
    build: ./services/books_api
    container_name: books-api
    ports:
      - "5001:5000"
    security_opt:
      - seccomp:./seccomp/seccomp-books-api.json
    networks:
      - backend
      - frontend

  readers-api:
    build: ./services/readers_api
    container_name: readers-api
    ports:
      - "5002:5000"
    security_opt:
      - seccomp:./seccomp/seccomp-readers-api.json
    networks:
      - backend
      - frontend

  staff-api:
    build: ./services/staff_api
    container_name: staff-api
    ports:
      - "5003:5000"
    security_opt:
      - seccomp:./seccomp/seccomp-staff-api.json
    networks:
      - backend
      - frontend

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - books-api
      - readers-api
      - staff-api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend

networks:
  frontend:
  backend:
