events {}

http {
    upstream books_api {
        server books-api:8080;
    }

    upstream readers_api {
        server readers-api:8080;
    }

    upstream staff_api {
        server staff-api:8080;
    }

    server {
        listen 80;

        location /health {
            return 200 'healthy';
        }

        location /api/books {
            proxy_pass http://books_api/books;
        }

        location /api/readers {
            proxy_pass http://readers_api/readers;
        }

        location /api/staff {
            proxy_pass http://staff_api/staff;
        }
    }
}
